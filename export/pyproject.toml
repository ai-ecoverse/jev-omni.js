[project]
name = "jev-omni-web-export"
version = "0.1.0"
description = "Export Jev-Omni (Gemma 4 12B unified decision classifier) to ONNX for the browser runtime"
requires-python = ">=3.14,<3.15"
dependencies = [
    # The model builder is vendored from microsoft/onnxruntime-genai PR #2473 (Gemma 4 text support) at
    # vendor/ortgenai_models_pr2473; the released onnxruntime-genai 0.16 stops at Gemma 3.
    "accelerate>=1.15.0",
    "datasets>=3.0",
    "numpy>=2.0",
    "torch>=2.10",
    "transformers==5.17.0",
    "onnxruntime>=1.23",
    "onnx>=1.19",
    "onnx-ir",
    "safetensors",
    "huggingface_hub",
    "tqdm",
    "pillow",
    "torchvision>=0.29.0",
]

[tool.uv]
package = false
